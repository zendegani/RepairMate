[project]
name = "repairmate-backend"
version = "0.1.0"
description = "FastAPI backend for the RepairMate hackathon demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
